# GitLab CI/CD para IFPE MVP
# Pipeline de integração contínua e deploy

stages:
  - test
  - build
  - deploy

# Variáveis globais
variables:
  POSTGRES_DB: ifpe_mvp_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DJANGO_SETTINGS_MODULE: config.settings
  PYTHON_VERSION: "3.12"

# Job de testes
test:
  stage: test
  image: python:${PYTHON_VERSION}
  services:
    - postgres:15-alpine
  
  before_script:
    - pip install -r requirements.txt
    - cp .env.example .env
  
  script:
    - python manage.py migrate
    - pytest --cov=. --cov-report=xml
  
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Job de build da imagem Docker
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
  
  only:
    - main
    - master

# Job de deploy (exemplo para servidor próprio)
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  
  script:
    - ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST "
        cd $DEPLOY_PATH &&
        docker-compose pull &&
        docker-compose up -d"
  
  environment:
    name: production
    url: https://ifpe-mvp.example.com
  
  only:
    - main

{% extends 'base.html' %}

{% block title %}Login - IFPE{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-header text-center">
                <i class="fas fa-sign-in-alt"></i> Login
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Usuário ou Email</label>
                        <input type="text" 
                               name="username" 
                               class="form-control" 
                               id="id_username" 
                               required 
                               autofocus>
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Senha</label>
                        <input type="password" 
                               name="password" 
                               class="form-control" 
                               id="id_password" 
                               required>
                    </div>
                    
                    {% if form.errors %}
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle"></i>
                        Usuário ou senha inválidos. Tente novamente.
                    </div>
                    {% endif %}
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-sign-in-alt"></i> Entrar
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center">
                <small class="text-muted">
                    Acesso restrito a estudantes e servidores do IFPE
                </small>
                <div class="mt-2">
                    <button type="button" class="btn btn-sm btn-outline-primary me-2" onclick="preencherAutomaticamente('estudante')">
                        <i class="fas fa-user-graduate"></i> Sou Estudante - Preencher automaticamente
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-success" onclick="preencherAutomaticamente('pedagogo')">
                        <i class="fas fa-chalkboard-teacher"></i> Sou Pedagogo - Preencher automaticamente
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function preencherAutomaticamente(tipo) {
        document.getElementById('id_username').value = '12345678900';
        document.getElementById('id_password').value = '12345678';
        
        if (tipo === 'estudante') {
            alert('Dados de estudante preenchidos automaticamente. CPF: 12345678900, Senha: 12345678');
        } else if (tipo === 'pedagogo') {
            alert('Dados de pedagogo preenchidos automaticamente. CPF: 12345678900, Senha: 12345678');
        }
    }
</script>
{% endblock %}

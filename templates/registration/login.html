<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PAMA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo-area {
            margin-bottom: 2rem;
        }

        .logo-area h2 {
            color: #4a5568;
            font-size: 1.5rem;
            margin-top: 0.5rem;
        }

        .icon {
            font-size: 3rem;
            color: #27ae60;
            margin-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #4a5568;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #27ae60;
        }

        .btn-login {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(to right, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
        }

        .error-message {
            background-color: #fed7d7;
            color: #c53030;
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            border: 1px solid #feb2b2;
        }

        .footer-links {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #718096;
        }

        .footer-links a {
            color: #27ae60;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .pedagogo-btn {
            background: #27ae60;
            color: white !important;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: bold !important;
            text-decoration: none !important;
            display: inline-block;
            margin-top: 0.5rem;
            cursor: pointer;
        }

        .pedagogo-btn:hover {
            background: #219a52;
            text-decoration: none !important;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-area">
            <div class="icon">🎓</div>
            <h2>PAMA Login</h2>
            <p style="color: #718096; font-size: 0.9rem;">Programa de Apoio e Manutenção Acadêmica</p>
        </div>

        {% if form.errors %}
            <div class="error-message">
                Usuário ou senha inválidos. Por favor, tente novamente.
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_username">Usuário (CPF)</label>
                <input type="text" name="username" id="id_username" value="{{ form.username.value|default:'' }}" required autofocus placeholder="Digite seu usuário">
            </div>

            <div class="form-group">
                <label for="id_password">Senha</label>
                <input type="password" name="password" id="id_password" value="{{ form.password.value|default:'' }}" required placeholder="Digite sua senha">
            </div>

            <button type="submit" class="btn-login">Entrar</button>
            
            <input type="hidden" name="next" value="{{ next }}">
        </form>

        <div class="footer-links">
            <p><a href="javascript:history.back()" style="color: #27ae60;">← Voltar à página anterior</a></p>
            <div style="margin-top: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center;">
                <a href="/login/?tipo=estudante" class="pedagogo-btn" style="background: #48bb78;">Sou Estudante - Preencher automaticamente</a>
                <a href="/login/?tipo=pedagogo" class="pedagogo-btn">Sou Pedagogo - Preencher automaticamente</a>
            </div>
        </div>
    </div>
</body>
</html>
